[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wafharness"
version = "0.1.0"
description = "WAF bypass as divergence between rewriting systems: model the parsers instead of cataloguing payloads"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "vulnquest58" }]
keywords = ["security", "waf", "bypass", "parser", "differential-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wafharness = "wafharness.cli:main"

[tool.setuptools]
packages = ["wafharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
